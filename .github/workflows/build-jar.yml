name: Build JAR

# Rebuilds out/KijelzoPC.jar from source and commits it back to the same branch,
# so the committed JAR always matches the code. Pushes made with GITHUB_TOKEN
# don't trigger workflows, so the bot commit can't loop.
on:
  push:
    branches: [main, raspberry]
    paths:
      - 'src/**'
      - 'lib/**'
      - 'build-*.sh'
      - '.github/workflows/build-jar.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-jar-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build
        run: |
          if [ "$GITHUB_REF_NAME" = "raspberry" ]; then
            ./build-raspberry.sh
          else
            ./build-windows.sh
          fi

      - name: Commit rebuilt JAR
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f out/KijelzoPC.jar
          if git diff --cached --quiet; then
            echo "JAR unchanged"
          else
            git commit -m "Rebuild KijelzoPC.jar from ${GITHUB_SHA::7}"
            git push
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: KijelzoPC-${{ github.ref_name }}
          path: out/KijelzoPC.jar
