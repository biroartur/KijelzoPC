# https://kijelzo.szeretet.ro on the Raspberry Pi (the name points to 192.168.1.12 on each church LAN).
# Installed by install-pi.sh as /etc/nginx/sites-available/kijelzo. Everything goes to the Node
# bridge, which serves the PWA files and the API. The certificate lives in /etc/kijelzo/tls/:
# a self-signed placeholder until setup-certificate.sh fetches the real Let's Encrypt one.

server {
    listen 80 default_server;
    server_name kijelzo.szeretet.ro;
    access_log off;
    return 301 https://kijelzo.szeretet.ro$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name kijelzo.szeretet.ro;

    ssl_certificate     /etc/kijelzo/tls/fullchain.pem;
    ssl_certificate_key /etc/kijelzo/tls/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options    nosniff always;
    add_header X-Frame-Options           DENY always;

    # No request log: saves SD card writes (errors still go to the system log)
    access_log off;
    error_log  syslog:server=unix:/dev/log warn;

    # Never cache the service worker or manifest (PWA updates)
    location = /service-worker.js {
        proxy_pass http://127.0.0.1:3000;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
    location = /manifest.json {
        proxy_pass http://127.0.0.1:3000;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }

    location / {
        proxy_pass            http://127.0.0.1:3000;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_read_timeout    10s;
        proxy_connect_timeout 5s;
    }
}
